[package]
name = "tufty-kernel"
version = "0.1.0"
edition = "2024"
build = "../user_apps/build.rs"

[[bin]]
name = "tufty-kernel"
path = "src/main.rs"
test = false
bench = false

[features]
defmt = ["dep:defmt", "embassy-rp/defmt", "embassy-time/defmt", "panic-probe/print-defmt"]
wifi = ["dep:cyw43", "dep:cyw43-pio"]

[dependencies]
embassy-executor = { version = "0.9", features = ["arch-cortex-m", "executor-thread", "nightly"] }
embassy-rp = { version = "0.8.0", features = ["rp235xb", "critical-section-impl", "unstable-pac", "time-driver"] }
embassy-futures = "0.1.2"
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
embassy-sync = "0.7"
critical-section = "1.2"
cortex-m = { version = "0.7.7", features = ["inline-asm"] }
cortex-m-rt = "0.7.5"
panic-probe = "0.3"
defmt = { version = "1", optional = true }
defmt-rtt = "1"
embedded-graphics = "0.8.1"
embedded-alloc = { version = "0.6", default-features = false, features = ["llff"] }
fixed = "1.29"
static_cell = "2"
strum = { version = "0.27", default-features = false }
heapless = "0.8"
tufty_sys = { path = "../tufty_sys" }
tufty = { path = "../tufty", features = ["builtin"] }
gboy = { path = "../user_apps/gboy", default-features = false, features = ["builtin"] }
chip8 = { path = "../user_apps/chip8", default-features = false, features = ["builtin"] }
snake = { path = "../user_apps/snake", default-features = false, features = ["builtin"] }
consoles = { path = "../user_apps/consoles", default-features = false, features = ["builtin"] }
tufty-love = { path = "../user_apps/love", default-features = false, features = ["builtin"] }
cyw43 = { version = "0.5", optional = true }
cyw43-pio = { version = "0.8", optional = true }
